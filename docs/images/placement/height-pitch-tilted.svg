<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" preserveAspectRatio="xMidYMid meet">
  <style>
    .label { fill: #444; font-family: -apple-system, system-ui, sans-serif; }
    .body { font-size: 11px; }
    .caption { font-size: 10px; opacity: 0.75; }
    .sensor { fill: #E53935; }
    .wedge { fill: #2196F3; fill-opacity: 0.18; stroke: #1976D2; stroke-width: 1.5; }
    .wall { fill: none; stroke: #444; stroke-width: 2; }
    .axis { stroke: #888; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
    .anglearc { fill: none; stroke: #444; stroke-width: 1; opacity: 0.7; }
    .bracket { stroke: #444; stroke-width: 1; fill: none; opacity: 0.7; }
    .person { fill: #444; opacity: 0.75; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #ddd; }
      .wall, .bracket { stroke: #ddd; }
      .axis, .anglearc { stroke: #bbb; }
      .person { fill: #ddd; }
    }
  </style>

  <!-- Annotation -->
  <text x="160" y="22" text-anchor="middle" class="label body">sensor tilted 5° downward</text>

  <!-- Pitch cone tilted 5° below horizontal: aim = +5°, edges at -12.5° (up) and +22.5° (down) -->
  <!-- upper endpoint: (40 + 150cos(-12.5°), 147.5 + 150sin(-12.5°)) = (186.44, 115.03) -->
  <!-- lower endpoint: (40 + 150cos(22.5°), 147.5 + 150sin(22.5°)) = (178.58, 204.90) -->
  <path d="M 40,147.5 L 186.44,115.03 A 150,150 0 0,1 178.58,204.90 Z" class="wedge"/>

  <!-- Aim centre-line (tilted 5° down, 6 m long — reaches 1.5 − 6·sin(5°) ≈ 1.0 m at range) -->
  <line x1="40" y1="147.5" x2="189.43" y2="160.58" class="axis"/>

  <!-- Wall -->
  <line x1="40" y1="30" x2="40" y2="185" class="wall"/>

  <!-- Floor -->
  <line x1="20" y1="185" x2="300" y2="185" class="wall"/>

  <!-- Mount-height bracket (1.5 m) -->
  <path d="M 35,147.5 L 30,147.5 L 30,185 L 35,185" class="bracket"/>
  <text x="27" y="170" text-anchor="end" class="label body">1.5 m</text>

  <!-- Angle indicator near sensor (35° spread) -->
  <path d="M 57.57,143.60 A 18,18 0 0,1 56.63,154.39" class="anglearc"/>
  <text x="62" y="154" class="label body">35°</text>

  <!-- Floor label -->
  <text x="300" y="181" text-anchor="end" class="label caption">floor</text>

  <!-- Floor-reach bracket: lower cone edge meets floor at 1.5 m / tan(22.5°) ≈ 3.62 m -->
  <path d="M 40,190 L 40,195 L 130.54,195 L 130.54,190" class="bracket"/>
  <text x="85.27" y="210" text-anchor="middle" class="label body">~3.6 m</text>

  <!-- Person (1.75 m = 43.75 px) at 2.5 m from the wall, 25 px/m scale -->
  <circle cx="102.5" cy="144.25" r="3" class="person"/>
  <path d="M 99,147.25 L 106,147.25 L 106,185 L 104,185 L 104,165 L 101,165 L 101,185 L 99,185 Z" class="person"/>

  <!-- Person-height bracket (1.75 m) -->
  <path d="M 109,141.25 L 114,141.25 L 114,185 L 109,185" class="bracket"/>
  <text x="117" y="166" class="label body">1.75 m</text>

  <!-- Sensor -->
  <circle cx="40" cy="147.5" r="4" class="sensor"/>
</svg>
