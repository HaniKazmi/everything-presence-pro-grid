<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <polygon points="0,0 7,3 0,6" fill="#1976D2" opacity="0.85"/>
    </marker>
  </defs>
  <style>
    .label { fill: #444; font-family: -apple-system, system-ui, sans-serif; }
    .title { fill: #444; font-family: -apple-system, system-ui, sans-serif; font-size: 11px; font-weight: 600; opacity: 0.85; }
    .body { font-size: 11px; }
    .caption { font-size: 10px; opacity: 0.75; }
    .sensor { fill: #E53935; }
    .wall { fill: none; stroke: #444; stroke-width: 2; }
    .axis { stroke: #888; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
    .person { fill: #444; opacity: 0.75; }
    .bracket { stroke: #444; stroke-width: 1; fill: none; opacity: 0.7; }
    .axisarrow { stroke: #1976D2; stroke-width: 1.5; fill: none; opacity: 0.85; }
    .axislabel { fill: #1976D2; font-size: 11px; font-weight: 600; }
    .axishead { fill: #1976D2; opacity: 0.85; }
    @media (prefers-color-scheme: dark) {
      .label, .title { fill: #ddd; }
      .wall, .bracket { stroke: #ddd; }
      .axis { stroke: #bbb; }
      .person { fill: #ddd; }
    }
  </style>

  <!-- ===== LEFT PANEL: wall mount, top-down (30 px/m) ===== -->
  <text x="120" y="22" text-anchor="middle" class="title">Wall mount — top-down</text>

  <!-- Room 4m × 4m -->
  <rect x="60" y="50" width="120" height="120" class="wall"/>

  <!-- Sensor mounted in top-left corner, aimed diagonally at the opposite corner. -->
  <!-- The radar's Y axis runs along that aim diagonal; X is perpendicular to it. -->

  <!-- Y axis: from sensor along aim diagonal toward opposite corner, with arrows at both ends (one pointing toward sensor) -->
  <line x1="66" y1="56" x2="108" y2="98" class="axisarrow" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="110" y="73" text-anchor="middle" class="axislabel">Y (depth)</text>

  <!-- X axis: along the perpendicular diagonal, from near top-right to near bottom-left, arrows on both ends -->
  <line x1="170" y1="60" x2="70" y2="160" class="axisarrow" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="145" y="124" text-anchor="middle" class="axislabel">X (lateral)</text>

  <!-- Sensor in corner -->
  <circle cx="60" cy="50" r="4" class="sensor"/>

  <!-- Caption -->
  <text x="120" y="200" text-anchor="middle" class="label caption">(X, Y) = floor position</text>

  <!-- ===== Separator ===== -->
  <line x1="240" y1="20" x2="240" y2="210" stroke="#aaa" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- ===== RIGHT PANEL: ceiling mount, side view (50 px/m) ===== -->
  <text x="360" y="22" text-anchor="middle" class="title">Ceiling mount — side view</text>

  <!-- Room cross-section: ceiling y=50, floor y=175 (2.5m at 50 px/m = 125 px); walls x=270 to x=450 -->
  <line x1="270" y1="50" x2="450" y2="50" class="wall"/>
  <line x1="270" y1="175" x2="450" y2="175" class="wall"/>
  <line x1="270" y1="50" x2="270" y2="175" class="wall"/>
  <line x1="450" y1="50" x2="450" y2="175" class="wall"/>

  <!-- Sensor centred on ceiling -->
  <circle cx="360" cy="50" r="4" class="sensor"/>

  <!-- X axis (lateral along ceiling) -->
  <line x1="360" y1="42" x2="400" y2="42" class="axisarrow"/>
  <polygon points="403,42 397,39.5 397,44.5" class="axishead"/>
  <text x="380" y="36" class="axislabel">X (lateral)</text>

  <!-- Y axis (downward from sensor along boresight) -->
  <line x1="352" y1="50" x2="352" y2="85" class="axisarrow"/>
  <polygon points="352,88 349.5,82 354.5,82" class="axishead"/>
  <text x="346" y="72" text-anchor="end" class="axislabel">Y (down)</text>

  <!-- Person A at lateral −1m (x=310); 1.7m tall → head top y=90, head centre cy=93, feet y=175 -->
  <circle cx="310" cy="93" r="3.5" class="person"/>
  <path d="M 307,96.5 L 313,96.5 L 313,175 L 311,175 L 311,140 L 309,140 L 309,175 L 307,175 Z" class="person"/>

  <!-- Person B at lateral +1m (x=410); same heights -->
  <circle cx="410" cy="93" r="3.5" class="person"/>
  <path d="M 407,96.5 L 413,96.5 L 413,175 L 411,175 L 411,140 L 409,140 L 409,175 L 407,175 Z" class="person"/>

  <!-- Bracket showing Y measurement (ceiling y=50 to head top y=90 = 0.8 m at 50 px/m) -->
  <path d="M 295,50 L 290,50 L 290,90 L 295,90" class="bracket"/>
  <text x="287" y="74" text-anchor="end" class="label body">0.8 m</text>

  <path d="M 425,50 L 430,50 L 430,90 L 425,90" class="bracket"/>
  <text x="433" y="74" class="label body">0.8 m</text>

  <!-- Caption -->
  <text x="360" y="200" text-anchor="middle" class="label caption">Y measures height, not floor position</text>
</svg>
