<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 152" preserveAspectRatio="xMidYMid meet">
  <style>
    .label { fill: #444; font-family: -apple-system, system-ui, sans-serif; }
    .body { font-size: 11px; }
    .caption { font-size: 10px; opacity: 0.75; }
    .title { fill: #444; font-family: -apple-system, system-ui, sans-serif; font-size: 11px; font-weight: 600; opacity: 0.8; }
    .sensor { fill: #E53935; }
    .wedge { fill: #2196F3; fill-opacity: 0.18; stroke: #1976D2; stroke-width: 1.5; }
    .wall { fill: none; stroke: #444; stroke-width: 2; }
    .axis { stroke: #888; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
    .anglearc { fill: none; stroke: #444; stroke-width: 1; opacity: 0.7; }
    .bracket { stroke: #444; stroke-width: 1; fill: none; opacity: 0.7; }
    @media (prefers-color-scheme: dark) {
      .label, .title { fill: #ddd; }
      .wall, .bracket { stroke: #ddd; }
      .axis, .anglearc { stroke: #bbb; }
    }
  </style>

  <!-- ========== LEFT PANEL: top-down view (2.5 m ceiling, 25 px/m) ========== -->

  <text x="142.5" y="18" text-anchor="middle" class="title">Top-down</text>

  <!-- Coverage strip: 120° azimuth × 35° pitch projected from 2.5 m ceiling -->
  <!-- width = 2·2.5·tan(60°) = 8.66 m → 216.5 px; height = 2·2.5·tan(17.5°) = 1.58 m → 39.5 px -->
  <rect x="34.25" y="70.25" width="216.5" height="39.5" class="wedge"/>

  <!-- Room outline (5 m × 4 m) -->
  <rect x="80" y="40" width="125" height="100" class="wall"/>

  <!-- Centre axis through sensor (spans strip) -->
  <line x1="34.25" y1="90" x2="250.75" y2="90" class="axis"/>

  <!-- Sensor -->
  <circle cx="142.5" cy="90" r="4" class="sensor"/>

  <!-- FOV labels -->
  <text x="160" y="86" class="label body">120° azimuth</text>
  <text x="100" y="62" class="label body">35° pitch</text>
  <line x1="110" y1="65" x2="110" y2="72" class="axis"/>

  <!-- ========== RIGHT PANEL: side view (2.5 m ceiling, 25 px/m) ========== -->

  <text x="372.5" y="18" text-anchor="middle" class="title">Side view</text>

  <!-- Pitch cone aimed straight down from ceiling (35° full, 17.5° half from vertical) -->
  <!-- Half-width on floor = 2.5 m × tan(17.5°) = 0.789 m → 19.72 px at 25 px/m -->
  <path d="M 372.5,40 L 352.78,102.5 L 392.22,102.5 Z" class="wedge"/>

  <!-- Centre axis (straight down through sensor) -->
  <line x1="372.5" y1="40" x2="372.5" y2="102.5" class="axis"/>

  <!-- Ceiling / floor / side walls (5 m wide room shown) -->
  <line x1="310" y1="40" x2="435" y2="40" class="wall"/>
  <line x1="310" y1="102.5" x2="435" y2="102.5" class="wall"/>
  <line x1="310" y1="40" x2="310" y2="102.5" class="wall"/>
  <line x1="435" y1="40" x2="435" y2="102.5" class="wall"/>

  <!-- Ceiling-height bracket (2.5 m) -->
  <path d="M 305,40 L 300,40 L 300,102.5 L 305,102.5" class="bracket"/>
  <text x="297" y="74" text-anchor="end" class="label body">2.5 m</text>

  <!-- Floor coverage bracket (~1.6 m) -->
  <path d="M 352.78,105 L 352.78,110 L 392.22,110 L 392.22,105" class="bracket"/>
  <text x="372.5" y="123" text-anchor="middle" class="label body">~1.6 m</text>

  <!-- Angle indicator at sensor -->
  <path d="M 366.49,59.07 A 20,20 0 0,0 378.51,59.07" class="anglearc"/>
  <text x="372.5" y="76" text-anchor="middle" class="label body">35°</text>

  <!-- Sensor -->
  <circle cx="372.5" cy="40" r="4" class="sensor"/>
</svg>
