<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" preserveAspectRatio="xMidYMid meet">
  <style>
    .label { fill: #444; font-family: -apple-system, system-ui, sans-serif; }
    .body { font-size: 11px; }
    .caption { font-size: 10px; opacity: 0.75; }
    .sensor { fill: #E53935; }
    .wedge { fill: #2196F3; fill-opacity: 0.18; stroke: #1976D2; stroke-width: 1.5; }
    .wall { fill: none; stroke: #444; stroke-width: 2; }
    .axis { stroke: #888; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
    .anglearc { fill: none; stroke: #444; stroke-width: 1; opacity: 0.7; }
    .bracket { stroke: #444; stroke-width: 1; fill: none; opacity: 0.7; }
    .person { fill: #444; opacity: 0.75; }
    .blind { fill: #E53935; fill-opacity: 0.10; stroke: #E53935; stroke-width: 1; stroke-dasharray: 3 2; opacity: 0.7; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #ddd; }
      .wall, .bracket { stroke: #ddd; }
      .axis, .anglearc { stroke: #bbb; }
      .person { fill: #ddd; }
    }
  </style>

  <!-- Cone clipped by ceiling (y=122.5, 2.5 m above floor) and floor (y=185) -->
  <!-- Sensor at (40, 147.5), 1.5 m above floor, 70° vertical FOV, horizontal aim, 6 m range -->
  <!-- Verts: sensor → up-edge meets ceiling → along ceiling → arc clockwise to where arc meets floor → along floor → lower-edge meets floor → back to sensor -->
  <path d="M 40,147.5 L 75.70,122.5 L 187.9,122.5 A 150,150 0 0,1 185.22,185 L 93.56,185 Z" class="wedge"/>

  <!-- Aim centre-line (horizontal) -->
  <line x1="40" y1="147.5" x2="190" y2="147.5" class="axis"/>

  <!-- Blind triangle: close to sensor, below cone, above floor -->
  <path d="M 40,147.5 L 40,185 L 93.56,185 Z" class="blind"/>

  <!-- Wall, ceiling, floor -->
  <line x1="40" y1="122.5" x2="40" y2="185" class="wall"/>
  <line x1="20" y1="122.5" x2="340" y2="122.5" class="wall"/>
  <line x1="20" y1="185" x2="340" y2="185" class="wall"/>

  <!-- Mount-height bracket (1.5 m) -->
  <path d="M 35,147.5 L 30,147.5 L 30,185 L 35,185" class="bracket"/>
  <text x="27" y="170" text-anchor="end" class="label body">1.5 m</text>

  <!-- 70° angle indicator (half-angle 35° at radius 22.5 from sensor) -->
  <path d="M 58.43,134.60 A 22.5,22.5 0 0,1 58.43,160.40" class="anglearc"/>
  <text x="66" y="151" class="label body">70°</text>

  <!-- Ceiling / floor labels -->
  <text x="335" y="118" text-anchor="end" class="label caption">ceiling</text>
  <text x="335" y="181" text-anchor="end" class="label caption">floor</text>

  <!-- Blind-zone caption -->
  <text x="70" y="210" text-anchor="middle" class="label caption">blind close to sensor</text>

  <!-- Person A (1.75 m, at 1 m horizontal): lower legs in blind triangle -->
  <circle cx="65" cy="144.25" r="3" class="person"/>
  <path d="M 61.5,147.25 L 68.5,147.25 L 68.5,185 L 66.5,185 L 66.5,165 L 63.5,165 L 63.5,185 L 61.5,185 Z" class="person"/>

  <!-- Person B (1.75 m, at 4 m horizontal): fully in cone -->
  <circle cx="140" cy="144.25" r="3" class="person"/>
  <path d="M 136.5,147.25 L 143.5,147.25 L 143.5,185 L 141.5,185 L 141.5,165 L 138.5,165 L 138.5,185 L 136.5,185 Z" class="person"/>

  <!-- Sensor -->
  <circle cx="40" cy="147.5" r="4" class="sensor"/>
</svg>
