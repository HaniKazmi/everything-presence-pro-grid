<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" preserveAspectRatio="xMidYMid meet">
  <style>
    .label { fill: #444; font-family: -apple-system, system-ui, sans-serif; }
    .title { font-size: 13px; font-weight: 600; }
    .body { font-size: 11px; }
    .caption { font-size: 10px; opacity: 0.75; }
    .axis { stroke: #888; stroke-width: 1; opacity: 0.6; }
    .axis-dashed { stroke: #888; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.45; }
    .baseline { stroke: #aaa; stroke-width: 1; }
    .occ-stroke { stroke: #5E35B1; stroke-width: 2.25; fill: none; }
    .occ-fill { fill: #5E35B1; fill-opacity: 0.10; }
    .occ-swatch { fill: #5E35B1; }
    .zone-stroke { stroke: #00838F; stroke-width: 2.25; fill: none; }
    .zone-fill { fill: #00838F; fill-opacity: 0.10; }
    .zone-swatch { fill: #00838F; }
    .phase-stroke { stroke: #C62828; stroke-width: 1.25; fill: none; }
    .phase-fill { fill: #C62828; fill-opacity: 0.06; stroke: #C62828; stroke-width: 1; }
    .phase-text { fill: #C62828; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #ddd; }
      .axis, .axis-dashed { stroke: #bbb; }
      .baseline { stroke: #888; }
      .occ-stroke { stroke: #B39DDB; }
      .occ-fill  { fill: #B39DDB; fill-opacity: 0.14; }
      .occ-swatch { fill: #B39DDB; }
      .zone-stroke { stroke: #4DD0E1; }
      .zone-fill  { fill: #4DD0E1; fill-opacity: 0.14; }
      .zone-swatch { fill: #4DD0E1; }
      .phase-stroke { stroke: #EF9A9A; }
      .phase-fill { fill: #EF9A9A; fill-opacity: 0.10; stroke: #EF9A9A; }
      .phase-text { fill: #EF9A9A; }
    }
  </style>

  <!-- Title -->
  <text x="360" y="22" text-anchor="middle" class="label title">Phase timeline — one visit</text>

  <!-- Phase callout bands (top) -->
  <!-- Fast trigger: brief, around the rising edge of Occupancy -->
  <rect x="120" y="48" width="80" height="26" rx="4" class="phase-fill"/>
  <text x="160" y="65" text-anchor="middle" class="label body phase-text">Fast trigger</text>

  <!-- Zone-specific actions: spans while Zone is high -->
  <rect x="208" y="48" width="180" height="26" rx="4" class="phase-fill"/>
  <text x="298" y="65" text-anchor="middle" class="label body phase-text">Zone-specific actions</text>

  <!-- Empty gate: brief, after Occupancy has been off for the timeout -->
  <rect x="588" y="48" width="92" height="26" rx="4" class="phase-fill"/>
  <text x="634" y="65" text-anchor="middle" class="label body phase-text">Empty gate</text>

  <!-- Vertical guide lines from callouts down through the signal traces -->
  <line x1="132" y1="74" x2="132" y2="270" class="axis-dashed"/>
  <line x1="200" y1="74" x2="200" y2="270" class="axis-dashed"/>
  <line x1="382" y1="74" x2="382" y2="270" class="axis-dashed"/>
  <line x1="495" y1="74" x2="495" y2="270" class="axis-dashed"/>
  <line x1="630" y1="74" x2="630" y2="270" class="axis-dashed"/>

  <!-- Occupancy lane -->
  <text x="105" y="143" text-anchor="end" class="label body">Occupancy</text>
  <line x1="120" y1="160" x2="700" y2="160" class="baseline"/>
  <!-- Filled area under high segment for visual weight -->
  <path d="M 132,160 L 132,120 L 495,120 L 495,160 Z" class="occ-fill"/>
  <!-- Stepped trace: low → high at t≈0 → low at t≈80 -->
  <path d="M 120,160 L 132,160 L 132,120 L 495,120 L 495,160 L 700,160" class="occ-stroke"/>

  <!-- Zone presence lane -->
  <text x="105" y="213" text-anchor="end" class="label body">Zone presence</text>
  <line x1="120" y1="230" x2="700" y2="230" class="baseline"/>
  <path d="M 200,230 L 200,190 L 382,190 L 382,230 Z" class="zone-fill"/>
  <path d="M 120,230 L 200,230 L 200,190 L 382,190 L 382,230 L 700,230" class="zone-stroke"/>

  <!-- Event annotations along the bottom -->
  <text x="132" y="270" text-anchor="middle" class="label caption">enters room</text>
  <text x="200" y="270" text-anchor="middle" class="label caption">enters zone</text>
  <text x="382" y="270" text-anchor="middle" class="label caption">leaves zone</text>
  <text x="495" y="270" text-anchor="middle" class="label caption">room empty</text>
  <text x="630" y="270" text-anchor="middle" class="label caption">timeout fires</text>

  <!-- Time axis arrow -->
  <line x1="120" y1="290" x2="700" y2="290" class="axis"/>
  <polygon points="700,290 692,286 692,294" fill="#888"/>
  <text x="410" y="307" text-anchor="middle" class="label caption">time</text>
</svg>
