<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" preserveAspectRatio="xMidYMid meet">
  <style>
    .label { fill: #444; font-family: -apple-system, system-ui, sans-serif; }
    .body { font-size: 11px; }
    .caption { font-size: 10px; opacity: 0.75; }
    .sensor { fill: #E53935; }
    .wall { fill: none; stroke: #444; stroke-width: 2; }
    .static-fill { fill: #1976D2; fill-opacity: 0.18; }
    .static-stroke { fill: none; stroke: #1976D2; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .boundary { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.6; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #ddd; }
      .wall { stroke: #ddd; }
      .boundary { stroke: #bbb; }
    }
  </style>

  <!--
    Long room 10 m × 4 m at 25 px/m. Sensors at the two top corners.
    Each sensor's static-presence sensor (100° aperture) is Auto-clipped
    to ~6.4 m, the diagonal of its 5 m × 4 m calibrated half. The two
    cones are clipped at the centerline (x=155) so the diagram reads
    "no overlap" cleanly.
  -->

  <defs>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="155" height="220"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="155" y="0" width="165" height="220"/>
    </clipPath>
  </defs>

  <!-- Sensor A: top-left corner, bisector at +45°, edges at -5° and +95°, 6.4 m radius (160 px). -->
  <g clip-path="url(#leftHalf)">
    <path d="M 30,40 L 189.39,26.06 A 160,160 0 0,1 16.06,199.39 Z" class="static-fill"/>
    <path d="M 189.39,26.06 A 160,160 0 0,1 16.06,199.39" class="static-stroke"/>
  </g>

  <!-- Sensor B: top-right corner, mirrored. -->
  <g clip-path="url(#rightHalf)">
    <path d="M 280,40 L 293.94,199.39 A 160,160 0 0,1 120.61,26.06 Z" class="static-fill"/>
    <path d="M 293.94,199.39 A 160,160 0 0,1 120.61,26.06" class="static-stroke"/>
  </g>

  <!-- Conceptual boundary between Sensor A's calibrated room and Sensor B's. -->
  <line x1="155" y1="40" x2="155" y2="140" class="boundary"/>

  <!-- Room outline drawn on top so the walls are visible over the cone fills. -->
  <rect x="30" y="40" width="250" height="100" class="wall"/>

  <!-- Sensors -->
  <circle cx="30" cy="40" r="4" class="sensor"/>
  <circle cx="280" cy="40" r="4" class="sensor"/>

  <!-- Sensor labels -->
  <text x="30" y="32" text-anchor="middle" class="label body">Sensor A</text>
  <text x="280" y="32" text-anchor="middle" class="label body">Sensor B</text>

  <!-- Half labels, placed inside the room so they don't collide at the centerline or render over the cone fills below the room. -->
  <text x="92" y="93" text-anchor="middle" class="label body">Kitchen</text>
  <text x="218" y="93" text-anchor="middle" class="label body">Dining</text>

  <!-- Centerline annotation -->
  <text x="155" y="155" text-anchor="middle" class="label caption">calibrated boundary</text>
</svg>
