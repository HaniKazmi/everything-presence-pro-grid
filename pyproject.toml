[project]
name = "everything-presence-pro"
version = "0.0.0"
requires-python = ">=3.13"

[project.optional-dependencies]
firmware = ["esphome"]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "ruff",
]
dev = [
    "everything-presence-pro[firmware,test]",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["custom_components.eppgrid"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/eppgrid"]

[tool.coverage.report]
show_missing = true

[tool.coverage.json]
output = "coverage.json"
