<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Everything Presence Pro Grid</title>
  <link rel="icon" type="image/png" href="./icon.png" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1a2137;
      --border: #2e3a57;
      --text: #e2e6f0;
      --text-muted: #8b91a8;
      --accent: #7dd3fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      text-align: center;
    }
    img.logo {
      width: 128px;
      height: 128px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./icon.png" alt="EPP Grid logo" />
    <h1>Everything Presence Pro Grid</h1>
    <p>User documentation coming soon.</p>
    <p>
      <a href="https://github.com/clintongormley/everything-presence-pro-grid">View the project on GitHub</a>
    </p>
  </main>
</body>
</html>
