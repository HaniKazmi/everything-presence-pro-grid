name: Firmware Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.6.2)'
        required: true
        default: '1.6.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - wifi-ble-co2
          - ethernet-ble-co2
          - wifi-ble-lite
    name: "Build ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate source versions match tag
        run: .github/scripts/validate-release.sh "${{ steps.version.outputs.version }}"

      - name: Install ESPHome
        run: pip install -r firmware/requirements.txt
      - name: Compile firmware
        run: esphome compile firmware/variants/${{ matrix.variant }}.yaml
      - name: Collect artifacts
        run: |
          mkdir -p dist
          BUILD_DIR="firmware/variants/.esphome/build/everything-presence-pro/.pioenvs/everything-presence-pro"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          cp "$BUILD_DIR/firmware.ota.bin" "dist/${VARIANT}.ota.bin"
          cp "$BUILD_DIR/bootloader.bin" "dist/${VARIANT}-bootloader.bin"
          cp "$BUILD_DIR/partitions.bin" "dist/${VARIANT}-partitions.bin"
          cp "$BUILD_DIR/firmware.bin" "dist/${VARIANT}.bin"
      - name: Generate ESP Web Tools manifest
        run: |
          VER="${{ steps.version.outputs.version }}"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          OTA_MD5=$(md5sum "dist/${VARIANT}.ota.bin" | cut -d' ' -f1)
          cat > "dist/${VARIANT}-manifest.json" << EOF
          {
            "name": "Everything Presence Pro (${{ matrix.variant }})",
            "version": "$VER",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  {"path": "${VARIANT}-bootloader.bin", "offset": 4096},
                  {"path": "${VARIANT}-partitions.bin", "offset": 32768},
                  {"path": "${VARIANT}.bin", "offset": 65536}
                ],
                "ota": {
                  "path": "${VARIANT}.ota.bin",
                  "md5": "$OTA_MD5"
                }
              }
            ]
          }
          EOF
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.variant }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true
      - name: Build release notes from the changelog
        id: notes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
          fi
          # Prefer the curated, user-facing CHANGES.md section as the release
          # body. Tags with no changelog entry (e.g. pre-release betas) exit
          # non-zero and fall back to GitHub's auto-generated commit notes.
          if .github/scripts/extract-release-notes.sh "$TAG" > release-notes.md; then
            echo "from_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "from_changelog=false" >> "$GITHUB_OUTPUT"
            rm -f release-notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          tag_name: v${{ steps.version.outputs.version }}
          fail_on_unmatched_files: false
          # Use the curated changelog section as the release body when present;
          # otherwise let GitHub generate notes from the commit log.
          body_path: ${{ steps.notes.outputs.from_changelog == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.from_changelog != 'true' }}
          prerelease: true
          make_latest: false
