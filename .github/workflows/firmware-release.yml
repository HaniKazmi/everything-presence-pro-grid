name: Firmware Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - wifi-ble-co2
          - ethernet-ble-co2
    name: "Build ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v5
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate source versions match tag
        run: .github/scripts/validate-release.sh "${{ steps.version.outputs.version }}"

      - name: Read firmware version
        id: firmware
        run: |
          FW=$(python3 -c "
          import re
          m = re.search(r'^FIRMWARE_VERSION\s*=\s*\"([^\"]+)\"', open('custom_components/eppgrid/const.py').read(), re.M)
          print(m.group(1) if m else '')
          ")
          echo "version=$FW" >> "$GITHUB_OUTPUT"
          echo "is_firmware_release=$([ \"$FW\" = \"${{ steps.version.outputs.version }}\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install ESPHome
        if: steps.firmware.outputs.is_firmware_release == 'true'
        run: pip install esphome
      - name: Compile firmware
        if: steps.firmware.outputs.is_firmware_release == 'true'
        run: esphome compile firmware/variants/${{ matrix.variant }}.yaml
      - name: Collect artifacts
        if: steps.firmware.outputs.is_firmware_release == 'true'
        run: |
          mkdir -p dist
          BUILD_DIR="firmware/variants/.esphome/build/everything-presence-pro/.pioenvs/everything-presence-pro"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          cp "$BUILD_DIR/firmware.ota.bin" "dist/${VARIANT}.ota.bin"
          cp "$BUILD_DIR/bootloader.bin" "dist/${VARIANT}-bootloader.bin"
          cp "$BUILD_DIR/partitions.bin" "dist/${VARIANT}-partitions.bin"
          cp "$BUILD_DIR/firmware.bin" "dist/${VARIANT}.bin"
      - name: Generate ESP Web Tools manifest
        if: steps.firmware.outputs.is_firmware_release == 'true'
        run: |
          VER="${{ steps.version.outputs.version }}"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          OTA_MD5=$(md5sum "dist/${VARIANT}.ota.bin" | cut -d' ' -f1)
          cat > "dist/${VARIANT}-manifest.json" << EOF
          {
            "name": "Everything Presence Pro (${{ matrix.variant }})",
            "version": "$VER",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  {"path": "${VARIANT}-bootloader.bin", "offset": 4096},
                  {"path": "${VARIANT}-partitions.bin", "offset": 32768},
                  {"path": "${VARIANT}.bin", "offset": 65536}
                ],
                "ota": {
                  "path": "${VARIANT}.ota.bin",
                  "md5": "$OTA_MD5"
                }
              }
            ]
          }
          EOF
      - name: Upload build artifacts
        if: steps.firmware.outputs.is_firmware_release == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: firmware-${{ matrix.variant }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true
        continue-on-error: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
