name: Firmware Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - wifi
          - ethernet
    name: "Build ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v5
      - name: Install ESPHome
        run: pip install esphome
      - name: Compile firmware
        run: esphome compile firmware/variants/${{ matrix.variant }}.yaml
      - name: Collect artifacts
        run: |
          mkdir -p dist
          BUILD_DIR="firmware/variants/.esphome/build/everything-presence-pro/.pioenvs/everything-presence-pro"
          cp "$BUILD_DIR/firmware.bin" "dist/everything-presence-pro-${{ matrix.variant }}.bin"
          cp "$BUILD_DIR/firmware.ota.bin" "dist/everything-presence-pro-${{ matrix.variant }}.ota.bin"
      - name: Generate ESP Web Tools manifest
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          OTA_MD5=$(md5sum "dist/everything-presence-pro-${{ matrix.variant }}.ota.bin" | cut -d' ' -f1)
          cat > "dist/everything-presence-pro-${{ matrix.variant }}-manifest.json" << EOF
          {
            "name": "Everything Presence Pro (${{ matrix.variant }})",
            "version": "$TAG",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  {"path": "everything-presence-pro-${{ matrix.variant }}.bin", "offset": 0}
                ],
                "ota": {
                  "path": "everything-presence-pro-${{ matrix.variant }}.ota.bin",
                  "md5": "$OTA_MD5"
                }
              }
            ]
          }
          EOF
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: firmware-${{ matrix.variant }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

  deploy-pages:
    needs: [build, release]
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Download firmware artifacts
        uses: actions/download-artifact@v5
        with:
          path: firmware
          pattern: firmware-*
          merge-multiple: true
      - name: Build pages site
        run: |
          mkdir -p _site
          cp -r tools/firmware-builder/* _site/
          mkdir -p _site/firmware
          cp firmware/*.json firmware/*.bin _site/firmware/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
