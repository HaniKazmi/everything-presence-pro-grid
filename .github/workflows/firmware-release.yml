name: Firmware Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - wifi-ble-co2
          - ethernet-ble-co2
    name: "Build ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v5
      - name: Extract and validate version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          # Validate tag matches manifest.json version
          MANIFEST_VER=$(python3 -c "import json; print(json.load(open('custom_components/eppgrid/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST_VER" ]; then
            echo "::error::Tag v$TAG does not match manifest.json version $MANIFEST_VER"
            exit 1
          fi

      - name: Auto-patch firmware version
        run: |
          VER="${{ steps.version.outputs.version }}"

          # Patch project.version in firmware base YAML
          sed -i "s/^    version: \".*\"/    version: \"$VER\"/" firmware/common/everything-presence-pro-base.yaml

          # Patch FIRMWARE_VERSION_STR in C++ header
          sed -i "s/FIRMWARE_VERSION_STR = \".*\"/FIRMWARE_VERSION_STR = \"$VER\"/" firmware/components/epp/epp_component.h

          # Verify patches applied
          grep "version: \"$VER\"" firmware/common/everything-presence-pro-base.yaml
          grep "FIRMWARE_VERSION_STR = \"$VER\"" firmware/components/epp/epp_component.h

      - name: Install ESPHome
        run: pip install esphome
      - name: Compile firmware
        run: esphome compile firmware/variants/${{ matrix.variant }}.yaml
      - name: Collect artifacts
        run: |
          mkdir -p dist
          BUILD_DIR="firmware/variants/.esphome/build/everything-presence-pro/.pioenvs/everything-presence-pro"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          cp "$BUILD_DIR/firmware.ota.bin" "dist/${VARIANT}.ota.bin"
          cp "$BUILD_DIR/bootloader.bin" "dist/${VARIANT}-bootloader.bin"
          cp "$BUILD_DIR/partitions.bin" "dist/${VARIANT}-partitions.bin"
          cp "$BUILD_DIR/firmware.bin" "dist/${VARIANT}.bin"
      - name: Generate ESP Web Tools manifest
        run: |
          VER="${{ steps.version.outputs.version }}"
          VARIANT="everything-presence-pro-${{ matrix.variant }}"
          OTA_MD5=$(md5sum "dist/${VARIANT}.ota.bin" | cut -d' ' -f1)
          cat > "dist/${VARIANT}-manifest.json" << EOF
          {
            "name": "Everything Presence Pro (${{ matrix.variant }})",
            "version": "$VER",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  {"path": "${VARIANT}-bootloader.bin", "offset": 4096},
                  {"path": "${VARIANT}-partitions.bin", "offset": 32768},
                  {"path": "${VARIANT}.bin", "offset": 65536}
                ],
                "ota": {
                  "path": "${VARIANT}.ota.bin",
                  "md5": "$OTA_MD5"
                }
              }
            ]
          }
          EOF
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: firmware-${{ matrix.variant }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

  deploy-pages:
    needs: [build, release]
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Download firmware artifacts
        uses: actions/download-artifact@v5
        with:
          path: firmware
          pattern: firmware-*
          merge-multiple: true
      - name: Build pages site
        run: |
          mkdir -p _site
          cp -r tools/firmware-builder/* _site/
          mkdir -p _site/firmware
          cp firmware/*.json firmware/*.bin _site/firmware/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
