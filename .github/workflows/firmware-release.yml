name: Firmware Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - wifi
          - wifi-ble
          - wifi-co2
          - wifi-ble-co2
          - ethernet
          - ethernet-ble
          - ethernet-co2
          - ethernet-ble-co2
    name: "Build ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v4
      - name: Install ESPHome
        run: pip install esphome
      - name: Compile firmware
        run: esphome compile firmware/variants/${{ matrix.variant }}.yaml
      - name: Collect artifacts
        run: |
          mkdir -p dist
          BUILD_DIR="firmware/variants/.esphome/build/everything-presence-pro/.pioenvs/everything-presence-pro"
          cp "$BUILD_DIR/firmware.bin" "dist/everything-presence-pro-${{ matrix.variant }}.bin"
          cp "$BUILD_DIR/firmware.ota.bin" "dist/everything-presence-pro-${{ matrix.variant }}.ota.bin"
      - name: Generate ESP Web Tools manifest
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          OTA_MD5=$(md5sum "dist/everything-presence-pro-${{ matrix.variant }}.ota.bin" | cut -d' ' -f1)
          cat > "dist/everything-presence-pro-${{ matrix.variant }}-manifest.json" << EOF
          {
            "name": "Everything Presence Pro (${{ matrix.variant }})",
            "version": "$TAG",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  {"path": "everything-presence-pro-${{ matrix.variant }}.bin", "offset": 0}
                ],
                "ota": {
                  "path": "everything-presence-pro-${{ matrix.variant }}.ota.bin",
                  "md5": "$OTA_MD5"
                }
              }
            ]
          }
          EOF
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: firmware-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
