name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-version: "2025.2.0"
            python-version: "3.13"
          - ha-version: "stable"
            python-version: "3.14"
          - ha-version: "dev"
            python-version: "3.14"
    name: "Python (HA ${{ matrix.ha-version }})"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install HA
        run: |
          if [ "${{ matrix.ha-version }}" = "dev" ]; then
            pip install git+https://github.com/home-assistant/core.git
          elif [ "${{ matrix.ha-version }}" = "stable" ]; then
            pip install homeassistant
          else
            pip install homeassistant==${{ matrix.ha-version }}
          fi
      - name: Install integration requirements
        run: pip install aioesphomeapi>=29.0.0
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Ruff lint
        run: ruff check custom_components/ tests/
      - name: Ruff format
        run: ruff format --check custom_components/ tests/
      - name: Pytest
        run: pytest tests/ -v --cov=custom_components/eppgrid --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    name: Frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Biome lint
        run: npx biome check src/ --diagnostic-level=error
      - name: Vitest with coverage
        run: npx vitest run --coverage

  cpp:
    runs-on: ubuntu-latest
    name: C++ Tests
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake, lcov, and bc
        run: sudo apt-get update && sudo apt-get install -y cmake lcov bc
      - name: Build with coverage
        working-directory: firmware/lib/epp_zone_engine
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Coverage
          cmake --build build
      - name: Run tests
        working-directory: firmware/lib/epp_zone_engine/build
        run: ctest --output-on-failure
      - name: Check coverage
        working-directory: firmware/lib/epp_zone_engine
        run: |
          lcov --capture --directory build --output-file build/coverage.info \
              --ignore-errors inconsistent,format
          lcov --extract build/coverage.info '*/src/*.cpp' \
              --output-file build/coverage-filtered.info \
              --ignore-errors unused
          lcov --summary build/coverage-filtered.info
          COV=$(lcov --summary build/coverage-filtered.info 2>&1 \
              | grep 'lines\.\.' | sed 's/.*: *\([0-9][0-9]*\(\.[0-9][0-9]*\)\?\)%.*/\1/')
          if ! echo "$COV" | grep -q '^[0-9][0-9]*\(\.[0-9][0-9]*\)\?$'; then
            echo "::error::Failed to parse C++ coverage percentage from lcov output (got: '$COV')"
            exit 1
          fi
          echo "C++ line coverage: ${COV}%"
          if [ "$(echo "$COV < 90" | bc)" -eq 1 ]; then
            echo "::error::C++ coverage ${COV}% is below 90% threshold"
            exit 1
          fi
      - name: Generate HTML report
        if: always()
        working-directory: firmware/lib/epp_zone_engine
        run: |
          genhtml build/coverage-filtered.info --output-directory build/coverage-html \
              --ignore-errors inconsistent
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-coverage-report
          path: firmware/lib/epp_zone_engine/build/coverage-html/
