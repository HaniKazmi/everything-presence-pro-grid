name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'fw/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/stage-firmware.sh'
  workflow_dispatch:
  workflow_run:
    workflows: ["Firmware Release"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip if triggered by a failed firmware-release run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Download latest release firmware (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts fw
          # Let gh failures (auth, network, API outage) fail the job — we do not
          # want to silently publish an empty fw/ if the release lookup broke.
          LATEST=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$LATEST" ]; then
            echo "No published releases — Pages will have no fw/ content"
            exit 0
          fi
          echo "Latest release: $LATEST"
          gh release download "$LATEST" -D artifacts --pattern 'everything-presence-pro-*'
          # A release exists; expect firmware binaries. If they're missing
          # something went wrong — fail rather than deploy an empty fw/ that
          # would wipe previously-published firmware URLs on Pages.
          if ! ls artifacts/*.bin >/dev/null 2>&1; then
            echo "::error::Release $LATEST has no firmware binaries; refusing to publish an empty fw/"
            exit 1
          fi
          VERSION="${LATEST#v}" ARTIFACTS=artifacts ./.github/scripts/stage-firmware.sh
      - name: Build mkdocs site
        run: mkdocs build --strict
      - name: Copy firmware manifests into site
        run: cp -r fw site/fw
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
