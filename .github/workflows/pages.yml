name: Deploy Firmware Builder

on:
  push:
    branches: [main]
    paths:
      - 'tools/firmware-builder/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download latest firmware release assets
        run: |
          mkdir -p _site/firmware
          gh release download --pattern '*.json' --pattern '*.bin' --dir _site/firmware || echo "No release assets found, skipping"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build pages site
        run: |
          cp -r tools/firmware-builder/* _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
