name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'fw/**'
      - 'index.html'
      - 'icon.png'
      - '.github/workflows/pages.yml'
      - '.github/scripts/stage-firmware.sh'
  workflow_dispatch:
  workflow_run:
    workflows: ["Firmware Release"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip if triggered by a failed firmware-release run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download latest release firmware (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts fw
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "No releases yet — Pages will have no fw/ content"
            exit 0
          fi
          echo "Latest release: $LATEST"
          gh release download "$LATEST" -D artifacts --pattern 'everything-presence-pro-*' || {
            echo "Release has no firmware assets matching everything-presence-pro-*"
            exit 0
          }
          if ! ls artifacts/*.bin >/dev/null 2>&1; then
            echo "No .bin artifacts in release — skipping stage"
            exit 0
          fi
          VERSION="${LATEST#v}" ARTIFACTS=artifacts ./.github/scripts/stage-firmware.sh
      - name: Build pages site
        run: |
          mkdir -p _site fw
          cp index.html _site/index.html
          cp icon.png _site/icon.png
          cp -r fw _site/fw
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
