name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'fw/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/stage-firmware.sh'
  workflow_dispatch:
  workflow_run:
    workflows: ["Firmware Release"]
    types: [completed]
  # Re-deploy when a pre-release is promoted to a regular release
  # (`gh release edit v{X} --prerelease=false --latest=true`). Without this,
  # fw/latest/ would keep pointing at the previously-latest firmware until
  # the next push to main.
  release:
    types: [released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip if triggered by a failed firmware-release run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Download latest release firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts fw
          # Every release builds firmware and gets marked as the latest
          # release (see .github/workflows/firmware-release.yml), so
          # /releases/latest always ships firmware binaries. Tolerate the
          # 404 case (no releases yet, or API hiccup) so docs can still
          # deploy without a release present.
          LATEST=$(gh api '/repos/${{ github.repository }}/releases/latest' --jq '.tag_name // ""' 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "No latest release found — Pages will have no fw/ content"
            exit 0
          fi
          echo "Latest release: $LATEST"
          gh release download "$LATEST" -D artifacts --pattern 'everything-presence-pro-*'
          if ! ls artifacts/*.bin >/dev/null 2>&1; then
            echo "::error::Latest release $LATEST has no firmware binaries — firmware-release workflow should attach them on every tag push"
            exit 1
          fi
          VERSION="${LATEST#v}" ARTIFACTS=artifacts ./.github/scripts/stage-firmware.sh
      - name: Build mkdocs site
        run: mkdocs build --strict
      - name: Copy firmware manifests into site
        run: cp -r fw site/fw
      - name: Verify web flasher manifests are present
        run: |
          # docs/user-guide/web-flasher.md links firmware via
          # <esp-web-install-button manifest="../../fw/latest/{variant}.json">.
          # mkdocs --strict can't validate raw-HTML attribute paths, so confirm
          # the referenced manifests were actually staged — this catches a
          # variant-name drift between the page and stage-firmware.sh before it
          # ships a 404-ing flash button. Skip on the no-release bootstrap.
          if [ ! -d site/fw/latest ]; then
            echo "No staged firmware (no release yet) — skipping web flasher manifest check"
            exit 0
          fi
          count=0
          fail=0
          while IFS= read -r rel; do
            count=$((count + 1))
            target="site/user-guide/web-flasher/${rel}"
            if [ ! -f "$target" ]; then
              echo "::error::web-flasher.md references ${rel} but ${target} is missing — variant drift with stage-firmware.sh?"
              fail=1
            else
              echo "ok: ${rel}"
            fi
          done < <(grep -oE 'manifest="[^"]*"' docs/user-guide/web-flasher.md \
            | sed -E 's/manifest="([^"]*)"/\1/')
          if [ "$count" -eq 0 ]; then
            echo "::error::No manifest references found in docs/user-guide/web-flasher.md"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
