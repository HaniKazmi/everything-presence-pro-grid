name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'fw/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/stage-firmware.sh'
  workflow_dispatch:
  workflow_run:
    workflows: ["Firmware Release"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip if triggered by a failed firmware-release run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Download latest release firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts fw
          # GitHub's "latest" pointer is set deliberately by the Firmware
          # Release workflow: only firmware-changing releases use make_latest=true,
          # so /releases/latest always points at a release that has firmware
          # binaries. No scanning needed.
          LATEST=$(gh api '/repos/${{ github.repository }}/releases/latest' --jq '.tag_name // ""')
          if [ -z "$LATEST" ]; then
            echo "No latest release found — Pages will have no fw/ content"
            exit 0
          fi
          echo "Latest release: $LATEST"
          gh release download "$LATEST" -D artifacts --pattern 'everything-presence-pro-*'
          if ! ls artifacts/*.bin >/dev/null 2>&1; then
            echo "::error::Latest release $LATEST has no firmware binaries — release was misconfigured (should not have been marked as latest)"
            exit 1
          fi
          VERSION="${LATEST#v}" ARTIFACTS=artifacts ./.github/scripts/stage-firmware.sh
      - name: Build mkdocs site
        run: mkdocs build --strict
      - name: Copy firmware manifests into site
        run: cp -r fw site/fw
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
