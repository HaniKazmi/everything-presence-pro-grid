<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>EPP Grid logo — narrower FOV reaching grid edges, dotted range arcs</title>
  <rect width="256" height="256" rx="48" fill="#0f172a"/>

  <!-- bold grid -->
  <g stroke="#4d6d9f" stroke-width="3">
    <path d="M32 32v192M64 32v192M96 32v192M128 32v192M160 32v192M192 32v192M224 32v192"/>
    <path d="M32 32h192M32 64h192M32 96h192M32 128h192M32 160h192M32 192h192M32 224h192"/>
  </g>

  <!-- FOV sector: sensor (128,48), radius 176, half-angle ~33° -->
  <!-- arc touches grid left (x=32), right (x=224), bottom (y=224) -->
  <path d="M 128 48 L 32 195.5 A 176 176 0 0 0 224 195.5 Z"
        fill="#0ea5e9" fill-opacity="0.32"
        stroke="#7dd3fc" stroke-width="3.5"
        stroke-linejoin="round"/>

  <!-- dotted range arcs, concentric with FOV, at 1/3 and 2/3 radius -->
  <g fill="none" stroke="#7dd3fc" stroke-width="2.5"
     stroke-linecap="round" stroke-dasharray="0 6" opacity="0.85">
    <path d="M 96 97.17 A 58.67 58.67 0 0 0 160 97.17"/>
    <path d="M 64 146.34 A 117.33 117.33 0 0 0 192 146.34"/>
  </g>

  <!-- target -->
  <circle cx="128" cy="160" r="12" fill="#fb923c"/>
  <circle cx="128" cy="160" r="22" fill="none" stroke="#fb923c" stroke-width="3" opacity="0.6"/>

  <!-- sensor -->
  <circle cx="128" cy="48" r="12" fill="#f8fafc"/>
  <circle cx="128" cy="48" r="20" fill="none" stroke="#f8fafc" stroke-width="2.5" opacity="0.55"/>
</svg>
