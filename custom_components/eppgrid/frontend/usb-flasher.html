<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--paper-font-body1_-_font-family, "Roboto", sans-serif);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: transparent;
  }
  .container {
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  esp-web-install-button {
    display: block;
    margin: 0 auto;
  }
  button {
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 500;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #03a9f4;
    color: white;
  }
  button:hover { background: #0288d1; }
  .status { margin-top: 16px; font-size: 14px; color: #666; }
</style>
</head>
<body>
<div class="container">
  <esp-web-install-button id="install-btn">
    <button slot="activate">Install Firmware</button>
  </esp-web-install-button>
  <div class="status" id="status"></div>
</div>
<script>
  // Read manifest URL from query params
  const params = new URLSearchParams(window.location.search);
  const manifest = params.get('manifest');
  if (manifest) {
    document.getElementById('install-btn').setAttribute('manifest', manifest);
  }

  // Notify parent when install completes or is cancelled
  const btn = document.getElementById('install-btn');
  btn.addEventListener('state-changed', (e) => {
    const state = e.detail;
    window.parent.postMessage({ type: 'esp-web-tools-state', state }, '*');
    document.getElementById('status').textContent =
      state === 'FINISHED' ? 'Installation complete!' :
      state === 'ERROR' ? 'Installation failed.' : '';
  });
</script>
</body>
</html>
