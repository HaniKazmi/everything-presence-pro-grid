<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Everything Presence Pro — Firmware Builder</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-alt: #222535;
      --border: #2e3347;
      --accent: #4f8ef7;
      --accent-hover: #6ba3ff;
      --text: #e2e6f0;
      --text-muted: #8b91a8;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }

    h1 span {
      display: block;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
    }

    h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .section {
      margin-bottom: 1.5rem;
    }

    /* Radio toggle */
    .toggle-group {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }

    .toggle-group label {
      flex: 1;
      text-align: center;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      color: var(--text-muted);
      user-select: none;
    }

    .toggle-group input[type="radio"] { display: none; }

    .toggle-group input[type="radio"]:checked + label {
      background: var(--accent);
      color: #fff;
    }

    /* Checkboxes */
    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: border-color 0.15s;
      user-select: none;
    }

    .checkbox-item:hover { border-color: var(--accent); }

    .checkbox-item input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
    }

    .checkbox-item input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox-item input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 0px;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .checkbox-label {
      flex: 1;
    }

    .checkbox-label strong {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .checkbox-label small {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Variant display */
    .variant-display {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .variant-display code {
      color: var(--accent);
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.85rem;
    }

    /* Install button */
    .install-section {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }

    esp-web-install-button {
      display: block;
    }

    esp-web-install-button::part(button) {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    esp-web-install-button::part(button):hover {
      background: var(--accent-hover);
    }

    .install-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    .install-note a { color: var(--accent); text-decoration: none; }
    .install-note a:hover { text-decoration: underline; }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm0 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 14.2a7.2 7.2 0 0 1-6-3.22c.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08a7.2 7.2 0 0 1-6 3.22z"/>
        </svg>
      </div>
      <h1>
        Everything Presence Pro
        <span>Firmware Builder</span>
      </h1>
    </div>

    <div class="section">
      <h2>Network</h2>
      <div class="toggle-group">
        <input type="radio" name="network" id="net-wifi" value="wifi" checked />
        <label for="net-wifi">WiFi</label>
        <input type="radio" name="network" id="net-ethernet" value="ethernet" />
        <label for="net-ethernet">Ethernet</label>
      </div>
    </div>

    <div class="section">
      <h2>Options</h2>
      <div class="checkbox-list">
        <label class="checkbox-item">
          <input type="checkbox" id="ble" />
          <div class="checkbox-label">
            <strong>Bluetooth (BLE)</strong>
            <small>Enable Bluetooth proxy and BLE tracking</small>
          </div>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="co2" />
          <div class="checkbox-label">
            <strong>CO2 Sensor</strong>
            <small>Enable CO2 monitoring (requires hardware add-on)</small>
          </div>
        </label>
      </div>
    </div>

    <hr />

    <div class="section">
      <h2>Selected variant</h2>
      <div class="variant-display">
        Firmware: <code id="variant-label">wifi</code>
      </div>
    </div>

    <div class="install-section">
      <esp-web-install-button id="install-btn" manifest=""></esp-web-install-button>
      <p class="install-note">
        Requires a Chromium-based browser (Chrome, Edge, Opera).
        Connect the device via USB before clicking Install.
        <a href="https://github.com/clintongormley/everything-presence-pro-grid/releases/latest" target="_blank">View all releases</a>
      </p>
    </div>
  </div>

  <script>
    function getVariant() {
      const network = document.querySelector('input[name="network"]:checked').value;
      const ble = document.getElementById('ble').checked;
      const co2 = document.getElementById('co2').checked;
      let variant = network;
      if (ble) variant += '-ble';
      if (co2) variant += '-co2';
      return variant;
    }

    function updateManifest() {
      const variant = getVariant();
      const url = `https://github.com/clintongormley/everything-presence-pro-grid/releases/latest/download/everything-presence-pro-${variant}-manifest.json`;
      document.getElementById('install-btn').setAttribute('manifest', url);
      document.getElementById('variant-label').textContent = variant;
    }

    document.querySelectorAll('input[name="network"]').forEach(el => el.addEventListener('change', updateManifest));
    document.getElementById('ble').addEventListener('change', updateManifest);
    document.getElementById('co2').addEventListener('change', updateManifest);

    // Initialise on load
    updateManifest();
  </script>
</body>
</html>
