# Explicit esp32_ble declaration so the BLE controller is initialized at
# boot. esp32_ble_tracker / bluetooth_proxy depend on it but apparently
# don't pull it in strongly enough on the ESPHome version used by our
# release-time GitHub Actions builds — without this, the tracker logs
# "Cannot start scan while ESP32BLE is disabled" and BLE stays a no-op
# regardless of switch state. The implicit pull-in worked in v0.97.0
# only because esp32_improv (since removed in PR #149) brought it in.
esp32_ble:
  enable_on_boot: true

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

# User-facing toggle for the BLE scan. Bluetooth proxy + 100%-duty-cycle
# active scan is the dominant heap consumer on this firmware (~30-80 KB
# resident with periodic transient spikes during scan-result processing).
# Users who don't actually have BLE devices to proxy can free most of
# that heap without reflashing.
#
# Scope of control:
#   - Off: stops esp32_ble_tracker scanning and reboots so any in-flight
#     bluetooth_proxy GATT-client connections drop cleanly.
#   - On: restarts scanning. (No reboot required — proxy and controller
#     stay loaded throughout.)
#
# What stays loaded even when off:
#   - bluetooth_proxy component code
#   - BLE controller stack (~10-15 KB) — initialized by ESPHome before
#     any of our automations run.
#
# Defaults ON for backwards compatibility on first flash; a deliberate
# OFF persists across reboots.
#
# CRITICAL: ESPHome template switches re-fire turn_off_action / turn_on_action
# on every boot when state is restored from NVS (see
# esphome/components/template/switch/template_switch.cpp setup()).
# An UNCONDITIONAL App.safe_reboot() in turn_off_action would therefore
# bootloop a device that was deliberately turned off: NVS=OFF -> turn_off_action
# fires -> reboot -> NVS still OFF -> repeat (WiFi never associates, device
# unreachable until NVS is erased). The reboot must be gated on the
# `ble_scan_safe_to_reboot` global, which we set to true 30 s post-boot.
# State-restoration on boot stops the scan but does NOT reboot; a real
# user-initiated toggle (after the 30 s settling delay) reboots cleanly.
globals:
  - id: ble_scan_safe_to_reboot
    type: bool
    initial_value: 'false'

esphome:
  on_boot:
    - priority: -100  # very late — after WiFi/API setup
      then:
        - delay: 30s
        - lambda: 'id(ble_scan_safe_to_reboot) = true;'

switch:
  - platform: template
    name: "BLE Scan"
    id: ble_scan_enabled
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - logger.log: "BLE Scan enabled — starting tracker scan"
      - esp32_ble_tracker.start_scan:
    turn_off_action:
      - logger.log: "BLE Scan disabled — stopping tracker scan"
      - esp32_ble_tracker.stop_scan:
      - if:
          condition:
            lambda: 'return id(ble_scan_safe_to_reboot);'
          then:
            - delay: 2s
            - logger.log: "Rebooting to drop active proxy GATT connections"
            - lambda: 'App.safe_reboot();'

# Pause BLE scan for the OTA download. The mbedtls TLS context held during the
# multi-second binary fetch is the largest transient heap consumer on this
# firmware; combined with bluetooth_proxy + active scan it has caused OOM-driven
# reboots mid-OTA. On success the device reboots and scan resumes from boot; on
# failure we restart it explicitly — but only if the user had it on, otherwise
# a failed OTA would silently override the user's BLE-off preference.
ota:
  - id: !extend ota_http_request
    on_begin:
      - logger.log: "OTA started — pausing BLE scan to free heap"
      - esp32_ble_tracker.stop_scan:
    on_error:
      - if:
          condition:
            switch.is_on: ble_scan_enabled
          then:
            - logger.log: "OTA failed — resuming BLE scan"
            - esp32_ble_tracker.start_scan:
          else:
            - logger.log: "OTA failed — BLE scan was disabled by user, leaving off"
