  "/>

  <!-- Right arm -->
  <path d="
    M 140,15
    L 140,85
    L 150,85
    Q 155,85 155,80
    L 155,20
    Q 155,15 150,15
    Z
  "/>

  <!-- Seat cushion area -->
  <rect x="20" y="25" width="120" height="60" rx="3" ry="3"/>

  <!-- Cushion divider -->
  <line x1="80" y1="28" x2="80" y2="82"/>
</svg>
