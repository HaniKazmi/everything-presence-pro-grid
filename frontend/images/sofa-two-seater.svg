<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Back frame -->
  <path d="
    M 15,10
    Q 15,5 20,5
    L 140,5
    Q 145,5 145,10
    L 145,25
    L 15,25
    Z
  "/>

  <!-- Left arm -->
  <path d="
    M 10,15
    Q 5,15 5,20
    L 5,80
    Q 5,85 10,85
    L 20,85
