<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.8107 5.5095 86.3786 83.5837" width="86.3786" height="83.5837" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
