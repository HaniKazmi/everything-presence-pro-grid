<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Chair seat -->
  <rect x="30" y="64" width="66" height="14" rx="4" ry="4"/>

  <!-- Chair stiles -->
  <line x1="33" y1="78" x2="30" y2="86"/>
  <line x1="93" y1="78" x2="96" y2="86"/>

  <!-- Chair back rail (curved) -->
  <path d="M 30,86 Q 63,94 96,86" stroke-width="2.5"/>

  <!-- Desktop surface -->
  <rect x="5" y="5" width="130" height="55" rx="2" ry="2"/>

  <!-- Laptop screen (foreshortened, hinged at top) -->
  <rect x="40" y="12" width="42" height="12" rx="1" ry="1"/>

  <!-- Laptop base/keyboard -->
  <rect x="40" y="26" width="42" height="26" rx="2" ry="2"/>

  <!-- Key rows -->
  <line x1="45" y1="32" x2="77" y2="32" stroke-width="1"/>
  <line x1="45" y1="37" x2="77" y2="37" stroke-width="1"/>
  <line x1="45" y1="42" x2="77" y2="42" stroke-width="1"/>

  <!-- Trackpad -->
  <rect x="54" y="44" width="14" height="6" rx="1" ry="1" stroke-width="1"/>

  <!-- Desk lamp shade -->
  <circle cx="110" cy="22" r="10"/>
  <circle cx="110" cy="22" r="4"/>
</svg>
