<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="220" height="100" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Back frame -->
  <path d="
    M 15,10
    Q 15,5 20,5
    L 200,5
    Q 205,5 205,10
    L 205,25
    L 15,25
    Z
  "/>

  <!-- Left arm -->
  <path d="
    M 10,15
    Q 5,15 5,20
    L 5,80
    Q 5,85 10,85
    L 20,85
    L 20,15
    Z
  "/>

  <!-- Right arm -->
  <path d="
    M 200,15
    L 200,85
    L 210,85
    Q 215,85 215,80
    L 215,20
    Q 215,15 210,15
    Z
  "/>

  <!-- Seat cushion area -->
  <rect x="20" y="25" width="180" height="60" rx="3" ry="3"/>

  <!-- Cushion dividers -->
  <line x1="80" y1="28" x2="80" y2="82"/>
  <line x1="140" y1="28" x2="140" y2="82"/>
</svg>
