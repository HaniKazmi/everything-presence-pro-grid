<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 92 62" width="92" height="62" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Counter / outer rim -->
  <rect x="5" y="5" width="90" height="60" rx="8" ry="8"/>

  <!-- Inner basin -->
  <ellipse cx="50" cy="40" rx="35" ry="20"/>

  <!-- Tap at the back (top edge) -->
  <circle cx="50" cy="12" r="3.5"/>
  <rect x="48.5" y="13" width="3" height="6" rx="1" ry="1"/>

  <!-- Drain in basin centre -->
  <circle cx="50" cy="40" r="3"/>
  <circle cx="50" cy="40" r="1" fill="black" stroke="none"/>
</svg>
