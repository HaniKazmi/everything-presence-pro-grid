<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Island surface -->
  <rect x="5" y="5" width="190" height="70" rx="3" ry="3"/>

  <!-- Sink basin -->
  <rect x="20" y="35" width="35" height="25" rx="5" ry="5"/>

  <!-- Drain -->
  <circle cx="37" cy="47" r="3"/>
  <circle cx="37" cy="47" r="1" fill="black" stroke="none"/>

  <!-- Tap base (outside sink corner) -->
  <circle cx="16" cy="32" r="3"/>
  <!-- Tap arm curving over sink -->
  <path d="M 16,32 Q 28,32 28,42"/>

  <!-- Stove: top-left burner -->
  <circle cx="130" cy="25" r="10"/>
  <circle cx="130" cy="25" r="5"/>

  <!-- Stove: top-right burner -->
  <circle cx="165" cy="25" r="10"/>
  <circle cx="165" cy="25" r="5"/>

  <!-- Stove: bottom-left burner -->
  <circle cx="130" cy="55" r="10"/>
  <circle cx="130" cy="55" r="5"/>

  <!-- Stove: bottom-right burner -->
  <circle cx="165" cy="55" r="10"/>
  <circle cx="165" cy="55" r="5"/>
</svg>
