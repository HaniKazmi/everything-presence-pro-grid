<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 92 82" width="92" height="82" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Back frame -->
  <path d="
    M 15,10
    Q 15,5 20,5
    L 80,5
    Q 85,5 85,10
    L 85,25
    L 15,25
    Z
  "/>

  <!-- Left arm -->
  <path d="
    M 10,15
    Q 5,15 5,20
    L 5,80
    Q 5,85 10,85
    L 20,85
    L 20,15
    Z
  "/>

  <!-- Right arm -->
  <path d="
    M 80,15
    L 80,85
    L 90,85
    Q 95,85 95,80
    L 95,20
    Q 95,15 90,15
    Z
  "/>

  <!-- Seat cushion -->
  <rect x="20" y="25" width="60" height="60" rx="3" ry="3"/>

</svg>
